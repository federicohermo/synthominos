# It runs `pnpm verify` whole: a list of its nodes here would go out of sync with the script.
name: verify

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Before setup-node: `cache: pnpm` needs the binary.
      - uses: pnpm/action-setup@v4

      # An exact version: a bare `22` moves the runtime of the gate with no change in the repo.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is not in the lockfile. `--with-deps`: the runner lacks the system libraries
      # that Chromium needs.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify
